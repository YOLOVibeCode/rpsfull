version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: rpsfull-postgres
    environment:
      POSTGRES_DB: rpsfull_dev
      POSTGRES_USER: rpsfull
      POSTGRES_PASSWORD: dev_password_change_in_production
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rpsfull"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - rpsfull-network

  redis:
    image: redis:7-alpine
    container_name: rpsfull-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - rpsfull-network

volumes:
  postgres_data:
  redis_data:

networks:
  rpsfull-network:
    driver: bridge

