version: '3.8'

# Docker Compose for Testing Environment
# Use this for running integration tests

services:
  postgres-test:
    image: postgres:15-alpine
    container_name: rpsfull-postgres-test
    environment:
      POSTGRES_DB: rpsfull_test
      POSTGRES_USER: rpsfull_test
      POSTGRES_PASSWORD: test_password_change_in_production
    ports:
      - "5433:5432"  # Different port to avoid conflicts
    volumes:
      - postgres_test_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rpsfull_test"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - rpsfull-test-network

  redis-test:
    image: redis:7-alpine
    container_name: rpsfull-redis-test
    ports:
      - "6380:6379"  # Different port to avoid conflicts
    volumes:
      - redis_test_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - rpsfull-test-network

volumes:
  postgres_test_data:
  redis_test_data:

networks:
  rpsfull-test-network:
    driver: bridge

